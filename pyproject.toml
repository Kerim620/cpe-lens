[project]
name = "cpe-lens"
version = "0.1.0"
description = "Local-only Huawei HiLink CPE management panel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CPE Lens contributors" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "huawei-lte-api>=2.0.1,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
dev = "cpe_lens.cli:dev"
start = "cpe_lens.cli:start"
test = "cpe_lens.cli:test"
lint = "cpe_lens.cli:lint"
typecheck = "cpe_lens.cli:typecheck"

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.11,<1.0",
    "types-requests>=2.32,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpe_lens"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cpe_lens",
    "tests",
    "docs",
    "frontend/src",
    "frontend/index.html",
    "frontend/package.json",
    "frontend/package-lock.json",
    "frontend/vite.config.ts",
    "frontend/tsconfig.json",
    "frontend/tsconfig.app.json",
    "frontend/tsconfig.node.json",
    "frontend/tailwind.config.js",
    "frontend/postcss.config.js",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
    "uv.lock",
]
exclude = [".uv-cache", ".python", "**/__pycache__", "**/*.pyc", "frontend/node_modules", "frontend/dist"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", ".uv-cache", ".python", "frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src/cpe_lens", "tests"]
mypy_path = "src"
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
