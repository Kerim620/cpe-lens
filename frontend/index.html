<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CPE Lens - local-only Huawei/Zowee H155-383 management panel" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23176B87'/%3E%3Cpath d='M8 20h16M10 16h12M13 12h6' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>CPE Lens</title>
    <script>
      try {
        var mode = localStorage.getItem("cpe-lens.theme");
        var dark =
          mode === "dark" ||
          ((!mode || mode === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (_) {
        /* localStorage may be unavailable; ThemeProvider will handle it. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
